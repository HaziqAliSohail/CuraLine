name: CI/CD

# Tests run on every push & PR. Deploy runs only on push to main, after tests pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys to the same box overlap.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          TESTING: "True"
        run: pytest -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      # Hand the built SPA to the deploy job so the server never needs Node.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          retention-days: 1

  deploy:
    name: Deploy to server
    needs: [backend-tests, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Pull the SPA built in the frontend job (no Node needed on the server).
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${DEPLOY_PORT:-22}"
          SSH="ssh -p $PORT -i ~/.ssh/id_deploy $DEPLOY_USER@$DEPLOY_HOST"
          APP_PATH="${APP_PATH:-~/curaline}"

          # 1. Sync backend code on the server to this exact commit.
          $SSH "cd $APP_PATH && git fetch --all --prune && git reset --hard ${{ github.sha }}"

          # 2. Push the freshly built SPA (server has no Node toolchain).
          rsync -az --delete -e "ssh -p $PORT -i ~/.ssh/id_deploy" \
            Frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_PATH/Frontend/dist/"

          # 3. Rebuild + roll the stack. The one-shot migrate service applies
          #    schema changes before web/worker/beat come back up.
          $SSH "cd $APP_PATH/Backend && \
            docker compose -f docker-compose.prod.yml build && \
            docker compose -f docker-compose.prod.yml up -d && \
            docker image prune -f"

          # 4. Smoke test the health endpoint from the server itself.
          $SSH "curl -fsS https://localhost/health -k >/dev/null && echo 'health OK' || (echo 'HEALTH CHECK FAILED' && exit 1)"
