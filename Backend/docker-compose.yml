services:
  smart_appointment_web:
    container_name: smart_appointment_web
    entrypoint: ./scripts/web.sh
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    restart: always
    volumes:
      - .:/BackgroundJobs
    networks:
      - default
      - appointment_network
    profiles: ["basic-setup", "web"]

  smart_appointment_web_worker:
    container_name: smart_appointment_web_worker
    build:
      context: .
    entrypoint: ./scripts/worker.sh
    volumes:
      - .:/BackgroundJobs
    networks:
      - default
      - appointment_network
    profiles: [ "basic-setup", "worker"]

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - default
      - appointment_network
    profiles: [ "basic-setup", "redis" ]

  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_NAME:-appointment_management}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    networks:
      - default
      - appointment_network
    profiles: [ "basic-setup", "postgresdb" ]

  nginx:
    image: nginx
    container_name: nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Set NGINX_CONF=nginx.prod.conf in .env for TLS (requires certs below)
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
      # Place fullchain.pem + privkey.pem here (or bind-mount /etc/letsencrypt/live/<domain>)
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - default
      - appointment_network
    profiles: [ "basic-setup", "nginx" ]

networks:
  appointment_network:
    driver: bridge

volumes:
  app-db-data:
