events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    # Don't leak nginx version in headers / error pages.
    server_tokens off;

    # Upstream API with keepalive connections (reused across requests).
    upstream backend {
        server web:8080;
        keepalive 32;
    }

    # Per-IP rate limits: stricter on auth, a general cap on everything else.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=120r/m;
    # Cap concurrent connections per IP.
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream timeouts: fail fast rather than hold sockets on a hung backend.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Compress JSON responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # Keepalive to upstream needs HTTP/1.1 + an empty Connection header.
    proxy_http_version 1.1;

    # Redirect plain HTTP -> HTTPS (keep ACME challenge reachable for renewals).
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Serve the built React SPA from the same origin as the API (no CORS).
        # Mount Frontend/dist to /usr/share/nginx/html (see docker-compose.prod.yml).
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Block oversized request bodies (1 MB) and limit concurrent conns/IP.
        client_max_body_size 1m;
        limit_conn conn_limit 20;

        # Auth endpoints: strict rate limit.
        location /v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_redirect off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # All other API endpoints: general rate limit.
        location /v1 {
            limit_req zone=api_limit burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_redirect off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health check for load balancers (not rate limited).
        location /health {
            proxy_pass http://backend;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Long-cache the hashed SPA assets (filenames change on each build).
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        # SPA fallback: serve index.html for client-side routes.
        location / {
            try_files $uri /index.html;
        }
    }
}
